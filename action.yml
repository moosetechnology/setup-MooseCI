name: 'Setup MooseCI'
description: 'Setup MooseCI for your repository'

inputs:
  project-path:
    description: Path (relative to the workspace) of the project to analyze
    required: false
    default: .
  comment-on-pr:
    description: Comment the report artifact link on pull requests
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: 'Run MooseCI'
      shell: bash
      run: |
        set -o pipefail
        cd "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
        docker run -v ".:/src" ghcr.io/moosetechnology/moose-ci:latest analyze | tee analysis.log
    
    - name: 'Upload report as artifact'
      uses: actions/upload-artifact@v4
      with:
        name: moose-ci-report
        path: "${{ inputs.project-path }}/.moose-ci/report/report*.json"
        if-no-files-found: error

    - name: 'Get analysis log'
      id: analysis-log
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
        LOG=$(sed -n '/Metrics/,$p' analysis.log | perl -pe 's/\e\[[0-9;]*m//g')
        echo "moose_ci_log<<MOOSECI_EOF" >> "$GITHUB_OUTPUT"
        echo "$LOG" >> "$GITHUB_OUTPUT"
        echo "MOOSECI_EOF" >> "$GITHUB_OUTPUT"

    - name: 'Get report download URL'
      id: artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_ID="${{ github.run_id }}"
        ARTIFACT_ID=$(gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
          --jq '.artifacts[] | select(.name == "moose-ci-report") | .id' | head -1)
        if [ -n "$ARTIFACT_ID" ]; then
          echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
        else
          echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
        fi

    - name: 'Comment report link on pull request'
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      uses: mshick/add-pr-comment@v3
      with:
        message: |
          ## MooseCI report: 
          - [download report](${{ steps.artifact.outputs.url }}) 
          ## Analysis log:
          ```
          ${{ steps.analysis-log.outputs.moose_ci_log }}
          ``` 

      