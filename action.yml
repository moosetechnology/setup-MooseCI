name: 'Setup MooseCI'
description: 'Setup MooseCI for your repository'

inputs:
  project-path:
    description: Path (relative to the workspace) of the project to analyze
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: 'Run MooseCI'
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
        docker run -v ".:/src" ghcr.io/moosetechnology/moose-ci:latest analyze
    
    - name: 'Upload report'
      uses: actions/upload-artifact@v4
      with:
        name: moose-ci-report
        path: "$GITHUB_WORKSPACE/${{ inputs.project-path }}/.moose-ci/report/report*.json"
        if-no-files-found: error 