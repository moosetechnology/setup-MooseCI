name: 'Setup MooseCI'
description: 'Setup MooseCI for your repository'

inputs:
  project-path:
    description: Path (relative to the workspace) of the project to analyze
    required: false
    default: .
  report-path:
    description: Directory (relative to the analyzed project) where the report files are written
    required: false
    default: .moose-ci/report

runs:
  using: composite
  steps:
    - name: 'Run MooseCI'
      shell: bash
      run: docker run -v "$GITHUB_WORKSPACE/${{ inputs.project-path }}:/src" ghcr.io/moosetechnology/moose-ci:latest analyze
    
    - name: 'Upload report'
      uses: actions/upload-artifact@v4
      with:
        name: moose-ci-report
        path: ${{ inputs.report-path }}/report*.json
        if-no-files-found: error 