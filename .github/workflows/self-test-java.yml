name: 'Self test MooseCI (Java)'
on: pull_request

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
            - uses: ./
              with:
                project-path: test-fixture-java
                project-language: java
            - uses: actions/download-artifact@v4
              with:
                name: moose-ci-report
                path: downloaded-report
            - name: 'Check JSON and HTML reports are in the artifact'
              run: |
                test -f downloaded-report/report-*.json
                test -f downloaded-report/report-*.html
            - name: 'Check architecture violation is reported'
              run: |
                jq -e '.violations[] | select(.category == "architecture" and .rule == "ui cannot dependOn infra" and .count > 0)' downloaded-report/report-*.json
